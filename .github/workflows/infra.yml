name: infra

# PR    : fmt → validate → plan → PR 코멘트 (CI)
# main  : production 환경 승인 후 apply (CD)
on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  id-token: write # OIDC로 AWS 임시 자격증명 발급
  contents: read
  pull-requests: write # plan 결과 PR 코멘트

# 같은 state를 동시에 건드리지 않도록 직렬 실행
concurrency:
  group: terraform-infra
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  TF_VERSION: 1.10.5
  TF_IN_AUTOMATION: "true"
  TF_VAR_my_ip_cidr: ${{ secrets.MY_IP_CIDR }}

defaults:
  run:
    working-directory: infra

jobs:
  plan:
    name: terraform plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Mask AWS account ID in logs
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init
        run: terraform init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: terraform validate
        run: terraform validate -no-color

      - name: terraform plan
        run: |
          terraform plan -input=false -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const account = execSync('aws sts get-caller-identity --query Account --output text').toString().trim();
            let plan = fs.readFileSync('infra/plan.txt', 'utf8').split(account).join('<ACCOUNT_ID>');
            const summary = (plan.match(/Plan: .*|No changes\..*/) || ['(summary not found)'])[0];
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncated, see workflow logs)';
            const body = [
              '### Terraform plan',
              `**${summary}**`,
              '<details><summary>plan 상세 보기</summary>',
              '',
              '```hcl',
              plan,
              '```',
              '</details>',
              '',
              `_workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  apply:
    name: terraform apply
    needs: plan
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production # 승인자가 승인해야 실행
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Mask AWS account ID in logs
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: terraform apply
        run: terraform apply -input=false -no-color -auto-approve
